<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="여백" />
    <meta name="theme-color" content="#141312" />
    <!-- 브라우저 탭 파비콘 — 작은 크기(≤32px)에서는 여백선이 뭉개지므로 굵은 획의 small 변형을 쓴다.
         .ico 를 맨 앞에 두는 건 사파리가 SVG 파비콘을 아직 지원하지 않아서다(크롬·파이어폭스는
         type 을 보고 SVG 를 골라 간다). PNG 는 그 둘 다 아닌 구형 브라우저용 폴백. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/yeobaek-icon-small.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/png/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/png/icon-16.png" />
    <!-- 아이패드 홈 화면 아이콘 — iOS 는 apple-touch-icon 에 SVG 를 안 받으므로 PNG 가 필수고,
         투명 픽셀은 검정으로 합성한 뒤 자기 마스크를 다시 씌운다. 그래서 둥근 모서리 + 투명인
         icon-180.png 이 아니라 꽉 찬 불투명 정사각(-square)을 준다. 둘 다 scripts/make-icons.mjs 산출물. -->
    <link rel="apple-touch-icon" href="/brand/png/icon-180-square.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>여백</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #141312; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
